<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>NPL Task List</title>
<meta name="description" content="Everything on deck for NPL, ordered by priority.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:      #F3F5F5;
    --surface:    #FFFFFF;
    --surface-2:  #EBEFEF;
    --ink:        #141C21;
    --muted:      #5C6A72;
    --faint:      #97A3A9;
    --line:       #DDE3E4;
    --accent:     #1E5F58;
    --accent-soft:#DDECEA;
    --accent-ink: #12403B;
    --on-accent:  #FFFFFF;
    --high:       #B8412C;
    --high-soft:  #F7E3DE;
    --medium:     #9A6E12;
    --medium-soft:#F7ECD3;
    --low:        #4E6470;
    --low-soft:   #E4EAED;
    --done:       #A5AFB4;
    --shadow:     0 1px 2px rgba(20,28,33,.05), 0 4px 14px rgba(20,28,33,.05);
    --who-bg-s: 40%; --who-bg-l: 91%; --who-fg-s: 46%; --who-fg-l: 31%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:      #0F1519;
      --surface:    #171F24;
      --surface-2:  #202A30;
      --ink:        #E6ECEE;
      --muted:      #9DABB2;
      --faint:      #6C7C84;
      --line:       #28343A;
      --accent:     #6FBBB1;
      --accent-soft:#1B3330;
      --accent-ink: #A8DCD4;
      --on-accent:  #0E1417;
      --high:       #E48A72;
      --high-soft:  #3A211C;
      --medium:     #DBB05E;
      --medium-soft:#382E18;
      --low:        #9CB0B9;
      --low-soft:   #26323A;
      --done:       #5E6C73;
      --shadow:     0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
      --who-bg-s: 30%; --who-bg-l: 20%; --who-fg-s: 52%; --who-fg-l: 76%;
    }
    .datepick::-webkit-calendar-picker-indicator { filter: invert(1); }
  }
  :root[data-theme="dark"] {
    --paper:      #0F1519;
    --surface:    #171F24;
    --surface-2:  #202A30;
    --ink:        #E6ECEE;
    --muted:      #9DABB2;
    --faint:      #6C7C84;
    --line:       #28343A;
    --accent:     #6FBBB1;
    --accent-soft:#1B3330;
    --accent-ink: #A8DCD4;
    --on-accent:  #0E1417;
    --high:       #E48A72;
    --high-soft:  #3A211C;
    --medium:     #DBB05E;
    --medium-soft:#382E18;
    --low:        #9CB0B9;
    --low-soft:   #26323A;
    --done:       #5E6C73;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
    --who-bg-s: 30%; --who-bg-l: 20%; --who-fg-s: 52%; --who-fg-l: 76%;
  }
  :root[data-theme="dark"] .datepick::-webkit-calendar-picker-indicator { filter: invert(1); }


  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .wrap {
    max-width: 44rem;
    margin: 0 auto;
    padding: clamp(1.5rem, 5vw, 3.5rem) clamp(1rem, 4vw, 1.5rem) 6rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  /* ---------- header ---------- */
  .head {
    display: flex;
    flex-direction: column;
    gap: .35rem;
  }
  .eyebrow {
    font-size: .8rem;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: Archivo, "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(1.9rem, 6vw, 2.5rem);
    line-height: 1.05;
    letter-spacing: -.02em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { color: var(--muted); margin: .25rem 0 0; max-width: 36em; }

  /* ---------- summary ---------- */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .5rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .7rem .85rem;
    display: flex;
    flex-direction: column;
    gap: .1rem;
    min-width: 0;
  }
  .stat .n {
    font-family: Archivo, "IBM Plex Sans", ui-sans-serif, sans-serif;
    font-size: 1.5rem;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
  }
  .stat .l { font-size: .78rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat.high .n { color: var(--high); }
  .stat.done .n { color: var(--accent); }
  .progress {
    grid-column: 1 / -1;
    height: 6px;
    background: var(--surface-2);
    border-radius: 3px;
    overflow: hidden;
  }
  .progress span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .35s ease; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: .75rem;
    flex-wrap: wrap;
  }
  .seg {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .seg button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: .85rem;
    font-weight: 500;
    padding: .4rem .9rem;
    border-radius: 999px;
    min-height: 36px;
  }
  .seg button[aria-pressed="true"] {
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }
  .savehint { font-size: .8rem; color: var(--faint); }

  /* ---------- groups ---------- */
  .groups { display: flex; flex-direction: column; gap: 1.6rem; }
  .group { display: flex; flex-direction: column; gap: .6rem; }
  .group-label {
    display: flex;
    align-items: center;
    gap: .5rem;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    padding-left: .25rem;
  }
  .group-label::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--gcolor, var(--low));
    flex: none;
  }
  .group-label .cnt { color: var(--faint); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .group[data-prio="high"]   { --gcolor: var(--high); }
  .group[data-prio="medium"] { --gcolor: var(--medium); }
  .group[data-prio="low"]    { --gcolor: var(--low); }

  ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .55rem; }

  li.task {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr auto;
    grid-template-areas:
      "check title remove"
      "check note  note"
      "check steps steps"
      "check meta  meta";
    column-gap: .8rem;
    padding: .95rem 1rem .9rem .95rem;
    align-items: start;
    position: relative;
    overflow: hidden;
  }
  li.task::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: var(--prio, var(--low));
  }
  li.task[data-prio="high"]   { --prio: var(--high);   --prio-soft: var(--high-soft); }
  li.task[data-prio="medium"] { --prio: var(--medium); --prio-soft: var(--medium-soft); }
  li.task[data-prio="low"]    { --prio: var(--low);    --prio-soft: var(--low-soft); }

  .check {
    grid-area: check;
    width: 26px; height: 26px;
    margin-top: .05rem;
    border: 2px solid var(--faint);
    border-radius: 50%;
    background: transparent;
    display: grid;
    place-items: center;
    padding: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s ease; }
  .check svg path { stroke: var(--on-accent); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .check:hover { border-color: var(--accent); }
  .check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .check[aria-pressed="true"] svg { opacity: 1; }

  .title {
    grid-area: title;
    font-family: Archivo, "IBM Plex Sans", ui-sans-serif, sans-serif;
    font-weight: 600;
    font-size: 1.06rem;
    line-height: 1.35;
    letter-spacing: -.005em;
    padding: .05rem .25rem 0 0;
    border-radius: 4px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .note {
    grid-area: note;
    margin: .2rem 0 0;
    color: var(--muted);
    font-size: .93rem;
    line-height: 1.5;
    max-width: 60ch;
    border-radius: 4px;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .note:empty::before { content: "Add a note…"; color: var(--faint); }
  [contenteditable]:focus { outline: 2px solid var(--accent); outline-offset: 3px; }

  .meta {
    grid-area: meta;
    margin-top: .65rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .45rem;
  }
  .tag {
    font-size: .76rem;
    font-weight: 500;
    color: var(--muted);
    background: var(--surface-2);
    border-radius: 6px;
    padding: .22rem .55rem;
    min-height: 28px;
    display: inline-flex;
    align-items: center;
  }
  .tag:empty::before { content: "Add tag"; color: var(--faint); }
  .prio-wrap { position: relative; display: inline-flex; }
  .prio-pick {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 6px;
    background: var(--prio-soft, var(--low-soft));
    color: var(--prio, var(--low));
    font-size: .76rem;
    font-weight: 600;
    padding: .22rem 1.5rem .22rem .6rem;
    min-height: 28px;
    cursor: pointer;
  }
  .prio-pick option { color: var(--ink); background: var(--surface); font-weight: 400; }
  .prio-wrap::after {
    content: "";
    position: absolute;
    right: .55rem; top: 50%;
    width: 6px; height: 6px;
    border-right: 1.5px solid currentColor;
    border-bottom: 1.5px solid currentColor;
    transform: translateY(-70%) rotate(45deg);
    color: var(--prio, var(--low));
    pointer-events: none;
  }
  .remove {
    grid-area: remove;
    width: 32px; height: 32px;
    margin: -.3rem -.35rem 0 0;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--faint);
    display: grid;
    place-items: center;
    padding: 0;
  }
  .remove svg { width: 14px; height: 14px; }
  .remove svg path { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .remove:hover { background: var(--high-soft); color: var(--high); }

  li.task.is-done { background: transparent; box-shadow: none; }
  li.task.is-done::before { background: var(--line); }
  li.task.is-done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  li.task.is-done .note, li.task.is-done .tag { color: var(--done); }
  li.task.is-done .prio-pick { opacity: .6; }

  .empty {
    color: var(--muted);
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 1.4rem 1rem;
    text-align: center;
  }

  /* ---------- add ---------- */
  .add {
    position: sticky;
    bottom: 0;
    margin-top: .5rem;
    padding: .75rem 0 max(.75rem, env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--paper) 70%, transparent);
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
  }
  .add .field {
    flex: 1 1 14rem;
    display: flex;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .add input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    padding: .7rem .9rem;
    min-height: 46px;
  }
  .add input::placeholder { color: var(--faint); }
  .add input:focus { outline: none; }
  .add .field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .add select {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-left: 1px solid var(--line);
    background: var(--surface-2);
    color: var(--muted);
    font-size: .85rem;
    font-weight: 500;
    padding: 0 1.9rem 0 .8rem;
    cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right .9rem center, right .6rem center;
    background-size: .3rem .3rem;
    background-repeat: no-repeat;
  }
  .add button {
    flex: 0 0 auto;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    font-weight: 600;
    padding: 0 1.2rem;
    min-height: 46px;
    box-shadow: var(--shadow);
  }
  .add button:hover { filter: brightness(1.07); }

  /* ---------- tracks (parallel sub-work) ---------- */
  .steps { grid-area: steps; margin-top: .7rem; }
  .steps-head {
    display: flex;
    align-items: baseline;
    gap: .5rem;
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: .25rem;
  }
  .steps-head .of { letter-spacing: 0; text-transform: none; font-weight: 500; }
  ul.steplist {
    list-style: none;
    margin: 0;
    padding: 0;
    border-left: 2px solid var(--line);
    padding-left: .7rem;
    display: flex;
    flex-direction: column;
    gap: .1rem;
  }
  li.step {
    display: flex;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: .45rem;
    padding: .25rem 0;
  }
  .stepcheck {
    width: 18px; height: 18px;
    margin-top: .18rem;
    flex: none;
    border: 1.5px solid var(--faint);
    border-radius: 5px;
    background: transparent;
    display: grid;
    place-items: center;
    padding: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .stepcheck svg { width: 10px; height: 10px; opacity: 0; transition: opacity .15s ease; }
  .stepcheck svg path { stroke: var(--on-accent); stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .stepcheck:hover { border-color: var(--accent); }
  .stepcheck[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .stepcheck[aria-pressed="true"] svg { opacity: 1; }
  .steptext {
    flex: 1 1 11rem;
    min-width: 0;
    font-size: .9rem;
    line-height: 1.45;
    border-radius: 4px;
    overflow-wrap: anywhere;
  }
  .steptext:empty::before { content: "What is this track?"; color: var(--faint); }
  li.step.is-done .steptext { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1.5px; }
  li.step.is-done .who { opacity: .55; }
  .stepside {
    flex: none;
    margin-left: auto;
    display: inline-flex;
    align-items: flex-start;
    gap: .3rem;
  }
  .steprm {
    flex: none;
    width: 24px; height: 24px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--faint);
    display: grid;
    place-items: center;
    padding: 0;
  }
  .steprm svg { width: 10px; height: 10px; }
  .steprm svg path { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .steprm:hover { background: var(--high-soft); color: var(--high); }

  /* One chip style for owners; the hue is picked from the name, so the same
     person is the same color everywhere without anyone configuring anything. */
  .who {
    flex: none;
    font-size: .72rem;
    font-weight: 600;
    border-radius: 5px;
    padding: .16rem .48rem;
    min-height: 26px;
    display: inline-flex;
    align-items: center;
    background: hsl(var(--wh, 210) var(--who-bg-s) var(--who-bg-l));
    color: hsl(var(--wh, 210) var(--who-fg-s) var(--who-fg-l));
  }
  .who:empty { background: var(--surface-2); color: var(--faint); font-weight: 500; }
  .who:empty::before { content: "Owner"; }
  .who-0 { --wh: 212; }
  .who-1 { --wh: 318; }
  .who-2 { --wh: 135; }
  .who-3 { --wh: 28; }
  .who-4 { --wh: 258; }
  .addstep {
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--faint);
    border-radius: 6px;
    padding: .2rem .55rem;
    min-height: 28px;
    font-size: .76rem;
    font-weight: 600;
  }
  .addstep:hover { border-color: var(--accent); color: var(--accent); }
  li.task.is-done .steps { opacity: .6; }

  /* ---------- date ---------- */
  .when { display: inline-flex; align-items: center; gap: .35rem; }
  .datepick {
    appearance: none;
    -webkit-appearance: none;
    border: 0;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    font-size: .76rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    padding: .22rem .5rem;
    min-height: 28px;
    cursor: pointer;
  }
  .datepick::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }
  .rel { font-size: .74rem; color: var(--faint); white-space: nowrap; }
  .rel.soon { color: var(--high); font-weight: 600; }
  .rel.past { color: var(--done); }
  .adddate {
    border: 1px dashed var(--line);
    background: transparent;
    color: var(--faint);
    border-radius: 6px;
    padding: .2rem .55rem;
    min-height: 28px;
    font-size: .76rem;
    font-weight: 600;
  }
  .adddate:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- code / branches ---------- */
  .repo { display: flex; flex-direction: column; gap: .7rem; }
  .repo-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: .75rem;
    flex-wrap: wrap;
  }
  .repo h2 {
    font-family: Archivo, "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: -.01em;
    margin: 0;
  }
  .repo-sub { margin: .15rem 0 0; font-size: .85rem; color: var(--muted); }
  .repo-sub a, .branch-note a { color: var(--accent); text-decoration: none; }
  .repo-sub a:hover, .branch-note a:hover { text-decoration: underline; }
  .ghost {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    padding: .35rem .8rem;
    font-size: .82rem;
    font-weight: 500;
    min-height: 34px;
  }
  .ghost:hover { border-color: var(--accent); color: var(--accent); }
  .ghost[disabled] { opacity: .55; cursor: default; }

  ul.branches { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
  li.branch {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
    padding: .6rem .8rem;
    display: flex;
    align-items: center;
    gap: .45rem;
    flex-wrap: wrap;
  }
  li.branch.is-default { border-color: var(--accent); }
  .bname {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    font-weight: 600;
    font-size: .95rem;
    color: var(--ink);
    text-decoration: none;
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .bname svg { width: 14px; height: 14px; flex: none; color: var(--faint); }
  .bname svg path, .bname svg circle { stroke: currentColor; stroke-width: 1.7; fill: none; }
  .bname:hover { color: var(--accent); }
  .bname:hover svg { color: var(--accent); }
  .badge {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .06em;
    text-transform: uppercase;
    border-radius: 5px;
    padding: .18rem .42rem;
    background: var(--accent-soft);
    color: var(--accent-ink);
  }
  .badge.lock { background: var(--surface-2); color: var(--muted); }
  .bmeta {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: .6rem;
    font-size: .78rem;
    color: var(--faint);
    white-space: nowrap;
  }
  .bsha {

<main class="wrap">

<div class="toast" id="toast" hidden>
  <span id="toast-msg"></span>

<script id="state" type="application/json">{"savedAt":0,"tasks":[{"id":"gospel-training-nov14","title":"Gospel conversation training — promote it network-wide","note":"Saturday, November 14, 9–5 at Neighbors and Nations. Open to the whole network, so promote it as a network-wide event rather than a local one — every church and team should hear about it with enough lead time to send people.","tag":"Events","owner":"","date":"2026-11-14","priority":"high","done":false},{"id":"consolidate","title":"Consolidate all NPL websites into one","note":"One product, three tracks that run at the same time rather than one after the other. Ivan takes the consolidation itself and the product vision that ties it together; Rick takes the back end for messaging and email, so the funnels are ready the day the site is.","tag":"Web","priority":"high","done":false,"owner":"Ivan","steps":[{"id":"c-site","text":"Primary consolidation — inventory every site we run now, pick the primary domain, move the content over, and redirect the rest so no old link dies.","owner":"Ivan","done":false},{"id":"c-sms","text":"Back end for the text-message funnels that go out — sending, sequences, opt-in and opt-out.","owner":"Rick","done":false},{"id":"c-email","text":"Email functionality — sending, list handling, and templates, on the same contact records as the texts.","owner":"Rick","done":false},{"id":"c-vision","text":"The product vision that brings it all together — how the site, texts, and email are one thing, so the three tracks land at once.","owner":"Ivan","done":false}]},{"id":"la2027","title":"Website + sign-up form for the LA 2027 push","note":"A page for the LA push with a form that collects names, emails, and how people want to help — so the list exists well before 2027.","tag":"LA 2027","priority":"medium","done":false},{"id":"gofundme","title":"Promote Trey's GoFundMe","note":"Share the link where it will actually reach people, and keep it visible on whatever site becomes the main one.","tag":"Fundraising","priority":"low","done":false}]}</script>

<script>
  // Pristine copy of this document, captured before anything renders. When the
  // page can publish itself (inside Claude), it swaps only the state block into
  // this shell, so the live DOM is never serialized.
  var PRISTINE = document.documentElement.outerHTML;

  (function () {
    var PRIOS = ["high", "medium", "low"];
    var LABELS = { high: "High priority", medium: "Medium priority", low: "Lower priority" };
    var LS_KEY = "npl-task-list";

    var stateEl = document.getElementById("state");
    var state = JSON.parse(stateEl.textContent);
    var filter = "open";
    var artifact = null;
    var canPublish = false;
    var timer = null;
    var toastTimer = null;
    var lastRemoved = null;
    var focusStep = null;

    // A newer local copy wins when this device could not publish last time.
    try {
      var local = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (local && local.savedAt > (state.savedAt || 0)) state = local;
    } catch (e) {}

    function $(id) { return document.getElementById(id); }
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function hint(msg) { $("savehint").textContent = msg; }

    // The same name always lands on the same chip color, so owners stay
    // recognizable across cards without anyone picking colors.
    function whoClass(name) {
      var s = String(name == null ? "" : name).trim();
      if (!s) return "";
      var h = 0;
      for (var i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0;
      return "who-" + (h % 5);
    }

    function whoChip(name, cls, label) {
      return '<span class="who ' + cls + " " + whoClass(name) + '" contenteditable="true" role="textbox" aria-label="' +
        label + '">' + esc(name || "") + "</span>";
    }

    // Dates are plain YYYY-MM-DD, read as local midnight so a date never
    // slides a day either side of the viewer's timezone.
    function localDate(iso) {
      var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
      return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
    }
    function today() {
      var n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }
    function isoOf(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") +
        "-" + String(d.getDate()).padStart(2, "0");
    }
    function relDay(iso) {
      var d = localDate(iso);
      if (!d) return { text: "", cls: "" };
      var days = Math.round((d - today()) / 86400000);
      if (days < -1) return { text: Math.abs(days) + " days ago", cls: "past" };
      if (days === -1) return { text: "yesterday", cls: "past" };
      if (days === 0) return { text: "today", cls: "soon" };
      if (days === 1) return { text: "tomorrow", cls: "soon" };
      if (days < 14) return { text: "in " + days + " days", cls: "soon" };
      if (days < 60) return { text: "in " + Math.round(days / 7) + " weeks", cls: "" };
      return { text: "in " + Math.round(days / 30) + " months", cls: "" };
    }

    function dateHtml(t) {
      if (!t.date) return '<button type="button" class="adddate">+ Date</button>';
      var rel = relDay(t.date);
      return '<span class="when"><input type="date" class="datepick" value="' + esc(t.date) +
        '" aria-label="Date"><span class="rel ' + rel.cls + '">' + esc(rel.text) + "</span></span>";
    }

    // Tracks are the parallel pieces of one task, each with its own owner, so
    // work that can run at the same time reads as one item, not four.
    function stepsHtml(t) {
      var steps = t.steps || [];
      if (!steps.length) return "";
      var done = steps.filter(function (x) { return x.done; }).length;
      var html = '<div class="steps"><div class="steps-head">Tracks <span class="of">' +
        done + " of " + steps.length + ' done, in parallel</span></div><ul class="steplist">';
      steps.forEach(function (x) {
        html += '<li class="step' + (x.done ? " is-done" : "") + '" data-sid="' + esc(x.id) + '">' +
          '<button class="stepcheck" aria-pressed="' + (x.done ? "true" : "false") +
          '" aria-label="' + (x.done ? "Mark track not done" : "Mark track done") + '">' +
          '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3 4.8 8.6 9.5 3.6"/></svg></button>' +
          '<span class="steptext" contenteditable="true" role="textbox" aria-label="Track">' + esc(x.text) + "</span>" +
          '<span class="stepside">' + whoChip(x.owner, "stepwho", "Track owner") +
          '<button class="steprm" aria-label="Remove track">' +
          '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>' +
          "</span></li>";
      });
      return html + "</ul></div>";
    }

    function stepFrom(el, t) {
      var li = el.closest("li.step");
      if (!li) return null;
      return (t.steps || []).filter(function (x) { return x.id === li.dataset.sid; })[0] || null;
    }

    function buildDoc(next) {
      var json = JSON.stringify(next).replace(/</g, "\\u003c");
      var doc = PRISTINE.replace(
        /(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
        function (m, open, close) { return open + json + close; }
      );
      return "<!doctype html>\n" + doc;
    }

    function save() {
      state.savedAt = Date.now();
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      render();
      if (!canPublish) { hint("Saved on this device"); return; }
      hint("Saving…");
      clearTimeout(timer);
      timer = setTimeout(function () {
        artifact.publish(buildDoc(state)).then(
          function () { hint("Saved for everyone"); },
          function (err) {
            hint(err && err.code === "conflict" ? "Loading a newer version…" : "Saved on this device only");
          }
        );
      }, 700);
    }

    function toast(msg) {
      $("toast-msg").textContent = msg;
      $("toast").hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { $("toast").hidden = true; lastRemoved = null; }, 6000);
    }

    function render() {
      var visible = state.tasks.filter(function (t) {
        return filter === "all" || (filter === "done" ? t.done : !t.done);
      });

      var html = "";
      PRIOS.forEach(function (p) {
        var items = visible.filter(function (t) { return t.priority === p; });
        if (!items.length) return;
        var openCount = state.tasks.filter(function (t) { return t.priority === p && !t.done; }).length;
        html += '<section class="group" data-prio="' + p + '"><div class="group-label">' + LABELS[p] +
          '<span class="cnt">' + openCount + " open</span></div><ul class=\"tasks\">";
        items.forEach(function (t) {
          html += '<li class="task' + (t.done ? " is-done" : "") + '" data-prio="' + t.priority + '" data-id="' + esc(t.id) + '">' +
            '<button class="check" aria-pressed="' + (t.done ? "true" : "false") + '" aria-label="' + (t.done ? "Mark not done" : "Mark done") + '">' +
            '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3 4.8 8.6 9.5 3.6"/></svg></button>' +
            '<div class="title" contenteditable="true" role="textbox" aria-label="Task">' + esc(t.title) + "</div>" +
            '<button class="remove" aria-label="Remove task"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>' +
            '<p class="note" contenteditable="true" role="textbox" aria-label="Note">' + esc(t.note) + "</p>" +
            stepsHtml(t) +
            '<div class="meta">' +
            '<span class="tag" contenteditable="true" role="textbox" aria-label="Tag">' + esc(t.tag) + "</span>" +
            whoChip(t.owner, "ownerchip", "Owner") +
            dateHtml(t) +
            '<span class="prio-wrap"><select class="prio-pick" aria-label="Priority">' +
            PRIOS.map(function (o) {
              return '<option value="' + o + '"' + (o === t.priority ? " selected" : "") + ">" +
                o.charAt(0).toUpperCase() + o.slice(1) + "</option>";
            }).join("") +
            "</select></span>" +
            '<button type="button" class="addstep">+ Track</button>' +
            "</div></li>";
        });
        html += "</ul></section>";
      });

      if (!html) {
        html = '<p class="empty">' +
          (filter === "done" ? "Nothing checked off yet." : "All clear — add the next thing below.") + "</p>";
      }
      $("groups").innerHTML = html;

      var total = state.tasks.length;
      var done = state.tasks.filter(function (t) { return t.done; }).length;
      var high = state.tasks.filter(function (t) { return !t.done && t.priority === "high"; }).length;
      $("s-open").textContent = total - done;
      $("s-high").textContent = high;
      $("s-done").textContent = done;
      $("bar").style.width = total ? (done / total) * 100 + "%" : "0%";
      $("updated").textContent = state.savedAt
        ? "Updated " + new Date(state.savedAt).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })
        : "Not updated yet";

      if (focusStep) {
        var fresh = $("groups").querySelector('li.step[data-sid="' + focusStep + '"] .steptext');
        focusStep = null;
        if (fresh) fresh.focus();
      }
    }

    function taskFrom(el) {
      var li = el.closest("li.task");
      if (!li) return null;
      return state.tasks.filter(function (t) { return t.id === li.dataset.id; })[0] || null;
    }

    var groups = $("groups");

    groups.addEventListener("click", function (e) {
      var t = taskFrom(e.target);
      if (!t) return;
      var stepBtn = e.target.closest(".stepcheck, .steprm");
      if (stepBtn) {
        var s = stepFrom(stepBtn, t);
        if (!s) return;
        if (stepBtn.classList.contains("stepcheck")) s.done = !s.done;
        else t.steps = t.steps.filter(function (x) { return x.id !== s.id; });
        save();
        return;
      }
      if (e.target.closest(".adddate")) {
        t.date = isoOf(today());
        save();
        var picker = $("groups").querySelector('li.task[data-id="' + t.id + '"] .datepick');
        if (picker) picker.focus();
        return;
      }
      if (e.target.closest(".addstep")) {
        t.steps = t.steps || [];
        focusStep = "s" + Date.now();
        t.steps.push({ id: focusStep, text: "", owner: "", done: false });
        save();
        return;
      }
      if (e.target.closest(".check")) { t.done = !t.done; save(); }
      else if (e.target.closest(".remove")) {
        lastRemoved = { task: t, index: state.tasks.indexOf(t) };
        state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
        save();
        toast('Removed "' + t.title + '"');
      }
    });

    groups.addEventListener("change", function (e) {
      var t = taskFrom(e.target);
      if (!t) return;
      if (e.target.classList.contains("prio-pick")) { t.priority = e.target.value; save(); }
      else if (e.target.classList.contains("datepick")) {
        if (e.target.value) t.date = e.target.value; else delete t.date;
        save();
      }
    });

    groups.addEventListener("blur", function (e) {
      var t = taskFrom(e.target);
      if (!t) return;
      var el = e.target;
      var text = el.textContent.replace(/\s+/g, " ").trim();
      if (el.classList.contains("steptext") || el.classList.contains("stepwho")) {
        var s = stepFrom(el, t);
        if (!s) return;
        if (el.classList.contains("stepwho")) {
          if (text !== (s.owner || "")) { s.owner = text; save(); }
        } else if (!text) {
          t.steps = t.steps.filter(function (x) { return x.id !== s.id; });
          save();
        } else if (text !== s.text) { s.text = text; save(); }
        return;
      }
      if (el.classList.contains("ownerchip")) {
        if (text !== (t.owner || "")) { t.owner = text; save(); }
        return;
      }
      if (el.classList.contains("title")) {
        if (!text) { el.textContent = t.title; return; }
        if (text !== t.title) { t.title = text; save(); }
      } else if (el.classList.contains("note") && text !== t.note) { t.note = text; save(); }
      else if (el.classList.contains("tag") && text !== t.tag) { t.tag = text; save(); }
    }, true);

    groups.addEventListener("paste", function (e) {
      if (!e.target.isContentEditable) return;
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
      document.execCommand("insertText", false, text);
    });

    groups.addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
      if (e.key === "Escape" && e.target.isContentEditable) { e.target.blur(); }
    });

    document.querySelectorAll(".seg button").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.dataset.filter;
        document.querySelectorAll(".seg button").forEach(function (o) {
          o.setAttribute("aria-pressed", String(o === b));
        });
        render();
      });
    });

    $("add").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = $("add-title");
      var title = input.value.trim();
      if (!title) { input.focus(); return; }
      state.tasks.push({
        id: "t" + Date.now(),
        title: title,
        note: "",
        tag: "",
        priority: $("add-prio").value,
        done: false
      });
      input.value = "";
      if (filter === "done") {
        filter = "open";
        document.querySelectorAll(".seg button").forEach(function (o) {
          o.setAttribute("aria-pressed", String(o.dataset.filter === "open"));
        });
      }
      save();
    });

    $("undo").addEventListener("click", function () {
      if (!lastRemoved) return;
      state.tasks.splice(Math.min(lastRemoved.index, state.tasks.length), 0, lastRemoved.task);
      lastRemoved = null;
      $("toast").hidden = true;
      save();
    });

    render();

    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (api) {
        if (!api) { hint("Saved on this device"); return; }
        artifact = api;
        canPublish = true;
        hint("Saved for everyone");
        $("where").textContent = "Edits save for everyone with this link";
      }, function () { hint("Saved on this device"); });
    } else {
      hint("Saved on this device");
    }
  })();

  // ---- Code: every branch on the GitHub repo, read live from the public API ----
  (function () {
    var OWNER = "claudekovalenko";
    var REPO = "npl-to-code-list";
    var API = "https://api.github.com/repos/" + OWNER + "/" + REPO;
    var WEB = "https://github.com/" + OWNER + "/" + REPO;
    var MAX_PAGES = 5;      // 500 branches is plenty
    var MAX_DETAIL = 15;    // one extra request each, so cap it

    var list = document.getElementById("branches");
    var sub = document.getElementById("repo-sub");
    var refresh = document.getElementById("repo-refresh");
    var subBase = sub.innerHTML;
    var branches = [];
    var defaultBranch = "";

    var ICON = '<svg viewBox="0 0 16 16" aria-hidden="true">' +
      '<path d="M4.5 5.5v5"/><circle cx="4.5" cy="3.5" r="1.6"/><circle cx="4.5" cy="12.5" r="1.6"/>' +
      '<circle cx="11.5" cy="3.5" r="1.6"/><path d="M11.5 5.5c0 2.6-2.3 3.4-4.4 3.9"/></svg>';

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function note(html) { list.innerHTML = '<li class="branch-note">' + html + "</li>"; }
    // Slashes in a branch name are path separators on GitHub, so escape around them.
    function refPath(name) { return String(name).split("/").map(encodeURIComponent).join("/"); }
    function link() { return '<a href="' + WEB + '/branches" target="_blank" rel="noopener">View the branches on GitHub</a>'; }

    function ago(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return "";
      var mins = (Date.now() - d.getTime()) / 60000;
      if (mins < 1) return "just now";
      if (mins < 60) return Math.round(mins) + "m ago";
      if (mins < 1440) return Math.round(mins / 60) + "h ago";
      if (mins < 43200) return Math.round(mins / 1440) + "d ago";
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function json(url) {
      return fetch(url, { headers: { Accept: "application/vnd.github+json" } }).then(function (r) {
        if (r.ok) return r.json();
        var err = new Error("HTTP " + r.status);
        err.status = r.status;
        throw err;
      });
    }

    // Default branch first, then freshest first once we know commit dates,
    // and alphabetically for anything still undated.
    function sort() {
      branches.sort(function (a, b) {
        if ((a.name === defaultBranch) !== (b.name === defaultBranch)) return a.name === defaultBranch ? -1 : 1;
        if (a.date && b.date) return a.date < b.date ? 1 : -1;
        if (a.date || b.date) return a.date ? -1 : 1;
        return a.name.localeCompare(b.name);
      });
    }

    function render() {
      if (!branches.length) { note("This repository has no branches yet."); return; }

      list.innerHTML = branches.map(function (b) {
        var isDefault = b.name === defaultBranch;
        var sha = String(b.commit && b.commit.sha || "");
        var html = '<li class="branch' + (isDefault ? " is-default" : "") + '">' +
          '<a class="bname" href="' + WEB + "/tree/" + refPath(b.name) + '" target="_blank" rel="noopener">' +
          ICON + esc(b.name) + "</a>";
        if (isDefault) html += '<span class="badge">default</span>';
        if (b.protected) html += '<span class="badge lock">protected</span>';
        html += '<span class="bmeta">';
        if (sha) html += '<a class="bsha" href="' + WEB + "/commit/" + esc(sha) + '" target="_blank" rel="noopener">' + esc(sha.slice(0, 7)) + "</a>";
        if (b.date) html += "<span>" + esc(ago(b.date)) + "</span>";
        html += "</span>";
        if (b.message) {
          html += '<p class="bmsg">' + esc(b.message) +
            (b.author ? ' <span class="who">· ' + esc(b.author) + "</span>" : "") + "</p>";
        }
        return html + "</li>";
      }).join("");

      sub.innerHTML = subBase + " · " + branches.length + " branch" + (branches.length === 1 ? "" : "es");
    }

    function page(n, acc) {
      return json(API + "/branches?per_page=100&page=" + n).then(function (rows) {
        acc = acc.concat(rows);
        return rows.length === 100 && n < MAX_PAGES ? page(n + 1, acc) : acc;
      });
    }

    // A second pass for the tip commit of the first few branches — the subject
    // line and date are what make the list readable, but they cost a request each.
    function detail() {
      return Promise.all(branches.slice(0, MAX_DETAIL).map(function (b) {
        if (!b.commit || !b.commit.url) return null;
        return json(b.commit.url).then(function (c) {
          var commit = c && c.commit || {};
          b.date = (commit.committer || commit.author || {}).date || "";
          b.author = (commit.author || {}).name || "";
          b.message = String(commit.message || "").split("\n")[0];
        }, function () {});
      })).then(function () { sort(); render(); });
    }

    function load() {
      refresh.disabled = true;
      note("Loading branches…");
      json(API).then(function (repo) { defaultBranch = repo.default_branch || ""; }, function () {})
        .then(function () { return page(1, []); })
        .then(function (all) {
          branches = all;
          sort();
          render();
          return detail();
        })
        .catch(function (err) {
          note(err && err.status === 403
            ? "GitHub is rate-limiting anonymous requests right now. " + link() + "."
            : "Couldn't reach the GitHub API from here. " + link() + ".");
        })
        .then(function () { refresh.disabled = false; });
    }

    refresh.addEventListener("click", load);
    load();
  })();
</script>
</body>
</html>
