<title>NPL Task List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --paper:    #F4F6F6;
    --surface:  #FFFFFF;
    --ink:      #141C21;
    --muted:    #5D6B73;
    --faint:    #8B979D;
    --line:     #E1E6E6;
    --line-soft:#EDF0F0;
    --accent:   #1E5F58;
    --accent-ink:#12403B;
    --high:     #A63D2B;
    --medium:   #8A6516;
    --low:      #4F626B;
    --done:     #9BA6AB;
    --focus:    #1E5F58;
    --on-accent:#FFFFFF;
    --shadow:   0 1px 2px rgba(20,28,33,.06), 0 6px 18px rgba(20,28,33,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper:    #10161A;
      --surface:  #182126;
      --ink:      #E6ECEE;
      --muted:    #9BAAB1;
      --faint:    #71828A;
      --line:     #2A363C;
      --line-soft:#222C31;
      --accent:   #6FBBB1;
      --accent-ink:#A8DCD4;
      --high:     #E08A72;
      --medium:   #D6AC5C;
      --low:      #93A7B0;
      --done:     #66757C;
      --focus:    #6FBBB1;
      --on-accent:#0E1417;
      --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"] {
    --paper:    #10161A;
    --surface:  #182126;
    --ink:      #E6ECEE;
    --muted:    #9BAAB1;
    --faint:    #71828A;
    --line:     #2A363C;
    --line-soft:#222C31;
    --accent:   #6FBBB1;
    --accent-ink:#A8DCD4;
    --high:     #E08A72;
    --medium:   #D6AC5C;
    --low:      #93A7B0;
    --done:     #66757C;
    --focus:    #6FBBB1;
    --on-accent:#0E1417;
    --shadow:   0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 46rem;
    margin: 0 auto;
    padding: 2.75rem 1.25rem 4rem;
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  /* ---------- header ---------- */
  header { display: flex; flex-direction: column; gap: .55rem; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    font-weight: 700;
    font-size: 2rem;
    line-height: 1.1;
    letter-spacing: -.015em;
    margin: 0;
    text-wrap: balance;
  }
  .lede { color: var(--muted); max-width: 34em; margin: 0; }

  /* ---------- progress ---------- */
  .status {
    display: flex;
    align-items: center;
    gap: .85rem;
    padding-top: .35rem;
  }
  .count {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .bar {
    flex: 1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    background: var(--accent);
    width: 0;
    transition: width .35s ease;
  }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .4rem;
    border-bottom: 1px solid var(--line);
    padding-bottom: .75rem;
  }
  .filter {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    background: none;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: .3rem .7rem;
    cursor: pointer;
  }
  .filter:hover { color: var(--ink); border-color: var(--line); }
  .filter[aria-pressed="true"] {
    color: var(--accent-ink);
    border-color: color-mix(in srgb, var(--accent) 40%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .savehint {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    color: var(--faint);
    letter-spacing: .04em;
  }

  /* ---------- groups + tasks ---------- */
  .groups { display: flex; flex-direction: column; gap: 1.9rem; }
  .group { display: flex; flex-direction: column; gap: .7rem; }
  .group-label {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    display: flex;
    align-items: baseline;
    gap: .5rem;
  }
  .group-label b { color: var(--muted); font-weight: 500; }

  ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .6rem; }

  li.task {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 3px solid var(--prio, var(--low));
    border-radius: 4px;
    box-shadow: var(--shadow);
    display: grid;
    grid-template-columns: auto 1fr;
    gap: .1rem .75rem;
    padding: .85rem .9rem .8rem;
    align-items: start;
  }
  li.task[data-prio="high"]   { --prio: var(--high); }
  li.task[data-prio="medium"] { --prio: var(--medium); }
  li.task[data-prio="low"]    { --prio: var(--low); }

  .check {
    width: 1.05rem;
    height: 1.05rem;
    margin-top: .18rem;
    border: 1.5px solid var(--faint);
    border-radius: 3px;
    background: transparent;
    cursor: pointer;
    display: grid;
    place-items: center;
    padding: 0;
    flex: none;
  }
  .check svg { width: .72rem; height: .72rem; opacity: 0; transition: opacity .15s ease; }
  .check svg path { stroke: var(--on-accent); stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .check:hover { border-color: var(--accent); }
  .check[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
  .check[aria-pressed="true"] svg { opacity: 1; }

  .title {
    font-family: Archivo, ui-sans-serif, system-ui, sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    letter-spacing: -.005em;
    line-height: 1.35;
    grid-column: 2;
    outline-offset: 3px;
  }
  .note {
    grid-column: 2;
    margin: .2rem 0 0;
    color: var(--muted);
    font-size: .875rem;
    max-width: 60ch;
    outline-offset: 3px;
  }
  .note:empty::before {
    content: "Add a note…";
    color: var(--faint);
  }
  .meta {
    grid-column: 2;
    margin-top: .55rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .5rem;
  }
  .tag {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: .15rem .4rem;
    outline-offset: 2px;
  }
  .prio-pick {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--prio, var(--low));
    background: transparent;
    border: 1px solid color-mix(in srgb, var(--prio, var(--low)) 35%, transparent);
    border-radius: 3px;
    padding: .16rem 1.1rem .16rem .4rem;
    cursor: pointer;
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: right .45rem center, right .29rem center;
    background-size: .16rem .16rem, .16rem .16rem;
    background-repeat: no-repeat;
  }
  .prio-pick option { color: var(--ink); background: var(--surface); }
  .remove {
    margin-left: auto;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .66rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--faint);
    background: none;
    border: none;
    padding: .16rem .2rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity .15s ease;
  }
  li.task:hover .remove, li.task:focus-within .remove { opacity: 1; }
  .remove:hover { color: var(--high); }

  li.task.is-done { background: transparent; box-shadow: none; border-color: var(--line-soft); }
  li.task.is-done .title { color: var(--done); text-decoration: line-through; text-decoration-thickness: 1px; font-weight: 500; }
  li.task.is-done .note { color: var(--done); }

  /* ---------- add ---------- */
  .add {
    display: flex;
    flex-wrap: wrap;
    gap: .5rem;
    padding-top: .3rem;
  }
  .add input {
    flex: 1 1 16rem;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .55rem .7rem;
  }
  .add input::placeholder { color: var(--faint); }
  .add select {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: .5rem .55rem;
    cursor: pointer;
  }
  .add button {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .72rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--on-accent);
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: .5rem 1rem;
    cursor: pointer;
  }
  .add button:hover { filter: brightness(1.06); }

  footer {
    border-top: 1px solid var(--line);
    padding-top: .9rem;
    display: flex;
    flex-wrap: wrap;
    gap: .5rem 1rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: .68rem;
    letter-spacing: .04em;
    color: var(--faint);
  }

  .empty { color: var(--faint); font-size: .9rem; padding: .4rem 0; }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">NPL</div>
    <h1>Task List</h1>
    <p class="lede">Everything on deck right now, ordered by what matters most. Tick things off, edit any line, add what comes up.</p>
    <div class="status">
      <div class="count" id="count">0 of 0 done</div>
      <div class="bar"><span id="bar"></span></div>
    </div>
  </header>

  <div class="toolbar">
    <button class="filter" data-filter="open" aria-pressed="true">Open</button>
    <button class="filter" data-filter="all" aria-pressed="false">All</button>
    <button class="filter" data-filter="done" aria-pressed="false">Done</button>
    <span class="savehint" id="savehint">Saved</span>
  </div>

  <div class="groups" id="groups"></div>

  <form class="add" id="add">
    <input id="add-title" type="text" placeholder="Add a task…" aria-label="New task" autocomplete="off">
    <select id="add-prio" aria-label="Priority">
      <option value="high">High</option>
      <option value="medium" selected>Medium</option>
      <option value="low">Low</option>
    </select>
    <button type="submit">Add</button>
  </form>

  <footer>
    <span id="updated">—</span>
    <span>Click any title or note to edit it</span>
  </footer>
</div>

<script id="state" type="application/json">{"savedAt":0,"tasks":[{"id":"consolidate","title":"Consolidate all NPL websites into one","note":"Inventory every site we run now, pick the primary domain, move the content over, and redirect the rest so no old link dies.","tag":"Web","priority":"high","done":false},{"id":"la2027","title":"Website + sign-up form for the LA 2027 push","note":"A page for the LA push with a form that collects names, emails, and how people want to help — so the list exists well before 2027.","tag":"LA 2027","priority":"medium","done":false},{"id":"gofundme","title":"Promote Trey's GoFundMe","note":"Share the link where it will actually reach people, and keep it visible on whatever site becomes the main one.","tag":"Fundraising","priority":"low","done":false}]}</script>

<script>
  // Pristine copy of this document, captured before anything renders. Publishing
  // swaps only the state block inside it, so the shell is never DOM-serialized.
  var PRISTINE = document.documentElement.outerHTML;

  (function () {
    var PRIOS = ["high", "medium", "low"];
    var LABELS = { high: "High priority", medium: "Medium priority", low: "Lower priority" };
    var LS_KEY = "npl-task-list";

    var stateEl = document.getElementById("state");
    var state = JSON.parse(stateEl.textContent);
    var filter = "open";
    var artifact = null;
    var canPublish = false;
    var timer = null;

    // A newer local copy only wins when this view could not publish last time.
    try {
      var local = JSON.parse(localStorage.getItem(LS_KEY) || "null");
      if (local && local.savedAt > (state.savedAt || 0)) state = local;
    } catch (e) {}

    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }

    function hint(msg) { document.getElementById("savehint").textContent = msg; }

    function buildDoc(next) {
      var json = JSON.stringify(next).replace(/</g, "\\u003c");
      var doc = PRISTINE.replace(
        /(<script id="state"[^>]*>)[\s\S]*?(<\/script>)/,
        function (m, open, close) { return open + json + close; }
      );
      return "<!doctype html>\n" + doc;
    }

    function save() {
      state.savedAt = Date.now();
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
      render();
      if (!canPublish) return;
      hint("Saving…");
      clearTimeout(timer);
      timer = setTimeout(function () {
        artifact.publish(buildDoc(state)).then(
          function () { hint("Saved for everyone"); },
          function (err) {
            hint(err && err.code === "conflict" ? "Reloading newer version…" : "Saved in this browser only");
          }
        );
      }, 700);
    }

    function render() {
      var groups = document.getElementById("groups");
      var visible = state.tasks.filter(function (t) {
        return filter === "all" || (filter === "done" ? t.done : !t.done);
      });

      var html = "";
      PRIOS.forEach(function (p) {
        var items = visible.filter(function (t) { return t.priority === p; });
        if (!items.length) return;
        var openCount = state.tasks.filter(function (t) { return t.priority === p && !t.done; }).length;
        html += '<section class="group"><div class="group-label">' + LABELS[p] +
          " <b>" + openCount + " open</b></div><ul class=\"tasks\">";
        items.forEach(function (t) {
          html += '<li class="task' + (t.done ? " is-done" : "") + '" data-prio="' + t.priority + '" data-id="' + esc(t.id) + '">' +
            '<button class="check" aria-pressed="' + (t.done ? "true" : "false") + '" aria-label="Mark done">' +
            '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.3 4.8 8.6 9.5 3.6"/></svg></button>' +
            '<div class="title" contenteditable="true" role="textbox" aria-label="Task">' + esc(t.title) + "</div>" +
            '<p class="note" contenteditable="true" role="textbox" aria-label="Note">' + esc(t.note) + "</p>" +
            '<div class="meta">' +
            '<span class="tag" contenteditable="true" role="textbox" aria-label="Tag">' + esc(t.tag) + "</span>" +
            '<select class="prio-pick" aria-label="Priority">' +
            PRIOS.map(function (o) {
              return '<option value="' + o + '"' + (o === t.priority ? " selected" : "") + ">" + o + "</option>";
            }).join("") +
            "</select>" +
            '<button class="remove">Remove</button>' +
            "</div></li>";
        });
        html += "</ul></section>";
      });

      if (!html) {
        html = '<p class="empty">' +
          (filter === "done" ? "Nothing checked off yet." : "All clear — add the next thing below.") + "</p>";
      }
      groups.innerHTML = html;

      var total = state.tasks.length;
      var done = state.tasks.filter(function (t) { return t.done; }).length;
      document.getElementById("count").textContent = done + " of " + total + " done";
      document.getElementById("bar").style.width = total ? (done / total) * 100 + "%" : "0%";
      document.getElementById("updated").textContent = state.savedAt
        ? "Last updated " + new Date(state.savedAt).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })
        : "Not updated yet";
    }

    function taskFrom(el) {
      var li = el.closest("li.task");
      if (!li) return null;
      return state.tasks.filter(function (t) { return t.id === li.dataset.id; })[0] || null;
    }

    document.getElementById("groups").addEventListener("click", function (e) {
      var t = taskFrom(e.target);
      if (!t) return;
      if (e.target.closest(".check")) { t.done = !t.done; save(); }
      else if (e.target.closest(".remove")) {
        state.tasks = state.tasks.filter(function (x) { return x.id !== t.id; });
        save();
      }
    });

    document.getElementById("groups").addEventListener("change", function (e) {
      var t = taskFrom(e.target);
      if (t && e.target.classList.contains("prio-pick")) { t.priority = e.target.value; save(); }
    });

    document.getElementById("groups").addEventListener("blur", function (e) {
      var t = taskFrom(e.target);
      if (!t) return;
      var el = e.target;
      var text = el.textContent.trim();
      if (el.classList.contains("title") && text && text !== t.title) { t.title = text; save(); }
      else if (el.classList.contains("note") && text !== t.note) { t.note = text; save(); }
      else if (el.classList.contains("tag") && text !== t.tag) { t.tag = text; save(); }
      else if (el.classList.contains("title") && !text) { el.textContent = t.title; }
    }, true);

    document.getElementById("groups").addEventListener("paste", function (e) {
      if (!e.target.isContentEditable) return;
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\s+/g, " ");
      document.execCommand("insertText", false, text);
    });

    document.getElementById("groups").addEventListener("keydown", function (e) {
      if (e.key === "Enter" && e.target.isContentEditable) { e.preventDefault(); e.target.blur(); }
    });

    document.querySelectorAll(".filter").forEach(function (b) {
      b.addEventListener("click", function () {
        filter = b.dataset.filter;
        document.querySelectorAll(".filter").forEach(function (o) {
          o.setAttribute("aria-pressed", String(o === b));
        });
        render();
      });
    });

    document.getElementById("add").addEventListener("submit", function (e) {
      e.preventDefault();
      var input = document.getElementById("add-title");
      var title = input.value.trim();
      if (!title) return;
      state.tasks.push({
        id: "t" + Date.now(),
        title: title,
        note: "",
        tag: "",
        priority: document.getElementById("add-prio").value,
        done: false
      });
      input.value = "";
      save();
    });

    render();

    if (window.claude && window.claude.use) {
      window.claude.use("artifact").then(function (api) {
        if (!api) { hint("Changes save in this browser"); return; }
        artifact = api;
        canPublish = true;
        hint("Saved for everyone");
      }, function () { hint("Changes save in this browser"); });
    } else {
      hint("Changes save in this browser");
    }
  })();
</script>
